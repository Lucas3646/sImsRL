name: Package APK as ZIP

on:
  push:
    branches:
      - feat/mobile-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download existing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0-demo --repo "$GITHUB_REPOSITORY" --pattern simsrl-v1-arm64.apk

      - name: Create ZIP
        run: zip -9 simsrl-v1-arm64.zip simsrl-v1-arm64.apk

      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0-demo simsrl-v1-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber
