name: Build Android APK

on:
  push:
    branches:
      - feat/mobile-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build optimized ARM64 APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Prepare downloads
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk simsrl-v1-arm64.apk
          zip simsrl-v1-arm64.zip simsrl-v1-arm64.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: simsrl-v1-arm64
          path: |
            simsrl-v1-arm64.apk
            simsrl-v1-arm64.zip
          retention-days: 30

      - name: Publish downloadable files
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-demo
        run: |
          gh release upload "$RELEASE_TAG" simsrl-v1-arm64.apk simsrl-v1-arm64.zip --clobber
